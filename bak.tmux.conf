set -g default-terminal 'tmux-256color'
set -g automatic-rename off
set -g mouse on
set -g history-limit 30000
set -g status-interval 15
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_current_command} | #(echo $AWS_ACCESS_KEY_ID)"
set -g allow-passthrough on

# Continuum is locally patched; Vim preserves its save trigger when applying status.
set -g @continuum-save-interval 15
set -g @continuum-restore on

setw -g mode-keys vi

# Fit every attached terminal while testing the multi-client redraw workaround.
setw -g window-size smallest
setw -g aggressive-resize off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Disabled after continuum recursion: set -g @continuum-boot 'off'

bind-key -r + resize-pane -U 10
bind-key -r - resize-pane -D 10
bind-key -r < resize-pane -L 10
bind-key -r > resize-pane -R 10
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key ] select-pane -R
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Delayed restore fallback on first server start (continuum_restore.sh only sleeps 1s).
# Disabled after continuum recursion: run -b '~/.vim/bin/tmux-boot-restore.sh'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
